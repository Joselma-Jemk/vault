name: release

# Un tag `v*` compile le binaire Windows avec Nuitka et publie une release.
# Le lancement manuel (workflow_dispatch) compile seulement, sans rien publier : pratique pour vérifier le build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" nuitka
      - name: Test
        run: python -m pytest -q
      - name: Build binary (Nuitka)
        run: >
          python -m nuitka
          --onefile
          --windows-console-mode=disable
          --enable-plugin=pyside6
          --include-package=vault
          --include-package-data=vault
          --windows-icon-from-ico=src/vault/assets/vault.ico
          --assume-yes-for-downloads
          --product-name=Vault
          --product-version=0.1.0
          --file-version=0.1.0
          --file-description="Local secrets vault"
          --output-dir=dist
          --output-filename=vault-gui.exe
          packaging/launcher.py
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/vault-gui.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  vault-gui.exe" | Out-File -Encoding ascii dist/SHA256SUMS
      - name: Smoke test (the binary starts and stays alive)
        shell: pwsh
        env:
          VAULT_HOME: ${{ runner.temp }}\vault-smoke
        run: |
          $p = Start-Process -FilePath dist/vault-gui.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "vault-gui.exe a quitté avec le code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v7
        with:
          name: vault-windows
          path: |
            dist/vault-gui.exe
            dist/SHA256SUMS
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/vault-gui.exe
            dist/SHA256SUMS
          generate_release_notes: true
