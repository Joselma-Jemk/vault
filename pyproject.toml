[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vault"
version = "0.1.0"
description = "Coffre de secrets local : interface Qt et CLI, sans affichage des valeurs"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Joselma00", email = "contact@joselma.online" }]
dependencies = ["PySide6>=6.12.0", "cryptography>=50.0.2"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.17.3"]

[project.urls]
Homepage = "https://github.com/Joselma-Jemk/vault"
Issues = "https://github.com/Joselma-Jemk/vault/issues"

[project.scripts]
vault = "vault.cli:main"

[project.gui-scripts]
vault-gui = "vault.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vault = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
